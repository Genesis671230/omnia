<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 20 160 160" width="512" height="512"><title>RAMZA</title><style>.ra-eye { transform-box: fill-box; transform-origin: center; animation-duration: 6s; animation-iteration-count: infinite; animation-timing-function: cubic-bezier(.34,1.4,.64,1); }
.ra-idle-l { animation-name: ra-idle-l; }
.ra-idle-r { animation-name: ra-idle-r; }
@keyframes ra-idle-l { 0%,12%,18%{transform:translate(0,0) rotate(0) scaleY(1)} 15%{transform:translate(0,0) rotate(0) scaleY(.1)} 28%,34%{transform:translate(9px,0) rotate(0) scaleY(1)} 40%,44%{transform:translate(-9px,0) rotate(0) scaleY(1)} 50%{transform:translate(0,0) rotate(0) scaleY(1)} 58%,84%{transform:translate(21px,-15px) rotate(90deg) scaleY(1)} 92%,100%{transform:translate(0,0) rotate(0) scaleY(1)} }
@keyframes ra-idle-r { 0%,12%,18%{transform:translate(0,0) rotate(0) scaleY(1)} 15%{transform:translate(0,0) rotate(0) scaleY(.1)} 28%,34%{transform:translate(9px,0) rotate(0) scaleY(1)} 40%,44%{transform:translate(-9px,0) rotate(0) scaleY(1)} 50%{transform:translate(0,0) rotate(0) scaleY(1)} 58%,84%{transform:translate(-21px,15px) rotate(90deg) scaleY(1)} 92%,100%{transform:translate(0,0) rotate(0) scaleY(1)} }@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="20" y="20" width="160" height="160" rx="54" fill="#4D66F0"/><rect class="ra-eye ra-idle-l" x="68" y="72" width="22" height="50" rx="11" fill="#FFFFFF"/><rect class="ra-eye ra-idle-r" x="110" y="72" width="22" height="50" rx="11" fill="#FFFFFF"/></svg>
