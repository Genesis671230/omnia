<!doctype html>
<html><head><meta charset="utf-8">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="engine.js"></script>
<script src="data.js"></script>
<link rel="stylesheet" href="v2.css">
<style>
  /* The green light: an "oddly satisfying" run. One blue dot → 145 bank credits turning green with a tick
     each, accelerating → month matched → one click → back to the dot (loop). Rows are recreated. */
  #dot{position:absolute;left:510px;top:830px;width:60px;height:60px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 0 rgba(75,103,238,.6)}
  #panel{position:absolute;left:70px;right:70px;top:300px;height:1000px;background:#0F1A3D;border:1.5px solid rgba(255,255,255,.12);border-radius:24px;overflow:hidden}
  #phead{position:absolute;left:0;right:0;top:0;height:150px;z-index:2;background:#0F1A3D;border-bottom:1.5px solid rgba(255,255,255,.1)}
  #clip{position:absolute;left:0;right:0;top:150px;bottom:0;overflow:hidden}
  #rows{position:absolute;left:0;right:0;top:0}
  .row{position:absolute;left:0;right:0;height:64px;display:flex;align-items:center;padding:0 34px;font-family:'IBM Plex Mono';font-size:24px;color:rgba(255,255,255,.55);border-bottom:1px solid rgba(255,255,255,.06)}
  .row .dt{width:120px}.row .ds{flex:1}.row .am{width:170px;text-align:right}
  .row .st{width:46px;height:30px;margin-left:24px;border-radius:15px;background:rgba(255,255,255,.12);position:relative}
  .row .st:after{content:"";position:absolute;left:4px;top:4px;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.5)}
  .row.ok{color:#fff;background:rgba(31,157,97,.14)}
  .row.ok .st{background:var(--green)}.row.ok .st:after{left:20px;background:#fff}
  #prog{position:absolute;left:34px;right:34px;top:116px;height:10px;border-radius:5px;background:rgba(255,255,255,.1)}
  #prog i{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:5px;background:var(--green);transform:scaleX(0);transform-origin:left}
  #ring{position:absolute;left:290px;top:560px;width:500px;height:500px}
  #ring circle{fill:none;stroke-width:34}
  #btn{position:absolute;left:190px;top:900px;width:700px;height:140px;border-radius:18px;background:var(--navy);color:#fff;font-family:'Urbanist';font-weight:700;font-size:52px;display:flex;align-items:center;justify-content:center}
</style></head>
<body>

<section class="sc black" id="s0"><div class="in">
  <div class="pill c" id="s0p" style="left:330px;right:330px;top:420px;text-align:center">WATCH TILL THE END</div>
  <div id="dot"></div>
</div></section>

<section class="sc black" id="s1"><div class="in">
  <div id="panel">
    <div id="phead">
      <div class="mk" style="left:34px;top:30px;width:64px;height:64px"></div>
      <div class="m" style="left:120px;top:34px;font-size:30px;color:#fff">Bank credits · <span id="mon"></span></div>
      <div class="m" style="left:120px;top:76px;font-size:22px;color:rgba(255,255,255,.5)">matching to gateway payouts…</div>
      <div class="d" id="cnt" style="right:34px;top:26px;font-size:76px;color:var(--green)">0</div>
      <div id="prog"><i></i></div>
    </div>
    <div id="clip"><div id="rows"></div></div>
  </div>
</div></section>

<section class="sc black" id="s2"><div class="in">
  <div class="d c" id="s2a" style="top:330px;font-size:150px"><span id="mon2"></span> <span style="color:var(--green)">✓</span></div>
  <svg id="ring" viewBox="0 0 500 500"><circle cx="250" cy="250" r="200" stroke="rgba(255,255,255,.1)"/><circle id="arc" cx="250" cy="250" r="200" stroke="#1F9D61" stroke-linecap="round" transform="rotate(-90 250 250)" stroke-dasharray="1257" stroke-dashoffset="1257"/></svg>
  <div class="d c" id="pct" style="top:730px;font-size:150px">0%</div>
  <div class="m c" id="s2b" style="top:1120px;font-size:32px;color:rgba(255,255,255,.7)">matched by the agent</div>
</div></section>

<section class="sc paper" id="s3"><div class="in">
  <div class="card" style="left:90px;right:90px;top:420px;height:360px">
    <div class="m mute" style="left:50px;top:50px;font-size:26px;letter-spacing:.12em">LEFT FOR YOUR REVIEW</div>
    <div class="d" id="left" style="left:44px;top:100px;font-size:170px"></div>
    <div class="m" style="left:50px;top:290px;font-size:26px;color:var(--mute)">each with the agent's suggested match</div>
  </div>
  <div id="btn"><span id="bt1">Approve</span><span id="bt2" style="position:absolute">Approved · posted to Zoho</span></div>
  <svg class="cur" id="cur" viewBox="0 0 24 24"><path d="M4 2l15 9.5-6.6 1.3L9.6 20z" fill="#fff" stroke="#0B1533" stroke-width="1.4"/></svg>
</div></section>

<section class="sc black" id="s4"><div class="in">
  <div class="mk" id="s4m" style="left:440px;top:560px;width:200px;height:200px"></div>
  <div class="d c" id="s4a" style="top:860px;font-size:120px">Comment <span style="color:var(--green)">GREEN</span></div>
  <div id="dot4" style="position:absolute;left:510px;top:830px;width:60px;height:60px;border-radius:50%;background:var(--blue);opacity:0"></div>
</div></section>

<div id="flash"></div><div id="cap"></div><div id="disc"></div>

<script src="v2.js"></script>
<script>
const { tl, $, w, on, off, pop, slam, hide, punch, D } = V;
V.scenes([1]);
const N = D.close_credits, OK = Math.round(N * D.close_matched_pct / 100), MON = D.close_month.split(" ")[0];
$("#mon").textContent = D.close_month; $("#mon2").textContent = MON; $("#left").textContent = `${N - OK} lines`;

// 0 · the dot breathes
E.sfx("drone", on(0));
gsap.set("#s0p", { autoAlpha: 0 });
pop("#s0p", w(0, "satisfying"), { y: 10 });
tl.to("#dot", { scale: 1.35, duration: 0.6, repeat: 3, yoyo: true, ease: "sine.inOut" }, on(0));
tl.to("#dot", { scale: 30, opacity: 0, duration: 0.5, ease: "power3.in" }, off(0) - 0.45);

// 1 · 145 rows go green, ticks accelerate (seeded so every render is identical)
let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const kinds = ["TABBY PAYOUT", "TAMARA SETTLEMENT", "STRIPE TRANSFER", "SHOPIFY PAYOUT", "COD REMITTANCE", "CARD SETTLEMENT"];
const wrong = new Set(); while (wrong.size < N - OK) wrong.add(3 + Math.floor(rnd() * (N - 4)));
const rowsEl = $("#rows"), rows = [];
for (let k = 0; k < N; k++) {
  const r = document.createElement("div"); r.className = "row"; r.style.top = `${k * 64}px`;
  const day = String(1 + Math.floor(k / 5)).padStart(2, "0");
  r.innerHTML = `<span class="dt">${day} SEP</span><span class="ds">${kinds[Math.floor(rnd() * kinds.length)]}</span><span class="am">${V.fmt2(200 + rnd() * 14000)}</span><span class="st"></span>`;
  rowsEl.appendChild(r); rows.push(r);
}
const t0 = w(1, "bank") , t1 = off(1) - 0.3, span = t1 - t0;
const okTimes = [];
rows.forEach((r, k) => {
  const at = t0 + span * (1 - Math.pow(1 - k / N, 0.55)); // early rows slow, later rows rapid
  if (!wrong.has(k)) { tl.set(r, { attr: { class: "row ok" } }, at); okTimes.push(at); E.sfx("ding", at, { vol: 0.7 }); }
  if (k > 11) tl.set(rowsEl, { y: -(k - 11) * 64 }, at); // keep the active row on screen
});
tl.to("#prog i", { scaleX: 1, duration: span, ease: "power1.in" }, t0);
const ticker = { p: 0 };
tl.to(ticker, { p: 1, duration: span + 0.3, ease: "none", onUpdate() { const now = tl.time(); $("#cnt").textContent = okTimes.filter((x) => x <= now + 1e-3).length; } }, t0);
E.sfx("rise", t1 - 2.2);

// 2 · month matched
gsap.set(["#s2a", "#pct", "#s2b", "#ring"], { autoAlpha: 0 });
slam("#s2a", on(2) + 0.05, "chime");
pop("#ring", on(2) + 0.2, { y: 0, s: 0.8 });
tl.to("#arc", { attr: { "stroke-dashoffset": 1257 * (1 - D.close_matched_pct / 100) }, duration: 0.9, ease: "power3.out" }, w(2, `${D.close_matched_pct}%`));
pop("#pct", w(2, `${D.close_matched_pct}%`), { y: 0 });
E.count($("#pct"), w(2, `${D.close_matched_pct}%`), D.close_matched_pct, { dur: 0.9, fmt: (v) => `${Math.round(v)}%` });
pop("#s2b", w(2, "matched"), { y: 10 });
punch(2, w(2, `${D.close_matched_pct}%`) + 0.9);

// 3 · one click
tl.set("#cur", { autoAlpha: 1, x: 900, y: 1500 }, on(3));
tl.to("#cur", { x: 560, y: 990, duration: 0.7, ease: "power2.out" }, w(3, "one"));
const click = w(3, "click", 0, true);
tl.to("#btn", { scale: 0.95, duration: 0.08, yoyo: true, repeat: 1 }, click);
tl.set("#btn", { backgroundColor: "#1F9D61" }, click + 0.08);
gsap.set("#bt2", { autoAlpha: 0 });
tl.set("#bt1", { autoAlpha: 0 }, click + 0.08); tl.set("#bt2", { autoAlpha: 1 }, click + 0.08);
E.sfx("click", click); E.sfx("chime", click + 0.1);
tl.set("#bt2", { fontSize: "44px" }, 0);

// 4 · comment GREEN, eyes blink, back to the dot
gsap.set(["#s4m", "#s4a"], { autoAlpha: 0 });
pop("#s4m", on(4) + 0.05, { s: 0.6, y: 0, sfx: "impact" });
tl.to("#s4m", { scaleY: 0.9, duration: 0.08, yoyo: true, repeat: 1 }, on(4) + 0.9);
pop("#s4a", w(4, "comment"), { sfx: "pop" });
hide(["#s4m", "#s4a"], V.T.dur - 0.7, 0.3);
tl.to("#dot4", { opacity: 1, duration: 0.3 }, V.T.dur - 0.5);

V.captions({ skip: [], light: [3] });
V.disclaimer(1, [3]);
</script>
</body></html>
